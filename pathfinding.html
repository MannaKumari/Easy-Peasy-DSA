<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathfinding Visualizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
    }
    h1 {
      margin-top: 20px;
    }
    #grid-container {
      display: grid;
      margin: 20px auto;
      width: max-content;
    }
    .cell {
      width: 20px;
      height: 20px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .start {
      background-color: green;
    }
    .end {
      background-color: red;
    }
    .visited {
      background-color: lightblue;
    }
    .path {
      background-color: yellow;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <h1>Pathfinding Visualizer (Dijkstra's)</h1>
  <a href="index.html">Back to Home</a><br>
  <button onclick="generateGrid()">Generate Grid</button>
  <button onclick="startDijkstra()">Start Dijkstra's</button>
  <div id="grid-container"></div>

  <script>
    let grid = [];
    let rows = 20;
    let cols = 30;
    let start = null;
    let end = null;

    function generateGrid() {
        grid = [];
        start = null;
        end = null;

        const container = document.getElementById("grid-container");
        container.innerHTML = "";
        container.style.gridTemplateColumns = `repeat(${cols}, 20px)`;

        for (let i = 0; i < rows; i++) {
            grid[i] = [];
            for (let j = 0; j < cols; j++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = i;
                cell.dataset.col = j;
                cell.addEventListener("click", () => handleClick(i, j));
                container.appendChild(cell);
                grid[i][j] = { row: i, col: j, cell, dist: Infinity, prev: null, visited: false };
            }
        }
    }

    function handleClick(i, j) {
        const node = grid[i][j];
        if (!start) {
            start = node;
            node.cell.classList.add("start");
            node.dist = 0;
        } else if (!end && node !== start) {
            end = node;
            node.cell.classList.add("end");
        }
    }

    function getNeighbors(node) {
        const dirs = [
            [0, 1], [1, 0], [0, -1], [-1, 0]
        ];
        const neighbors = [];
        for (let [dx, dy] of dirs) {
            const ni = node.row + dx;
            const nj = node.col + dy;
            if (ni >= 0 && ni < rows && nj >= 0 && nj < cols) {
                neighbors.push(grid[ni][nj]);
            }
        }
        return neighbors;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startDijkstra() {
        if (!start || !end) return alert("Please select start and end points.");

        let unvisited = [];
        for (let row of grid) {
            for (let node of row) {
                node.dist = Infinity;
                node.visited = false;
                node.prev = null;
                node.cell.classList.remove("visited", "path");
                if (node !== start && node !== end) node.cell.classList.remove("start", "end");
                unvisited.push(node);
            }
        }
        start.dist = 0;

        while (unvisited.length > 0) {
            // Get node with smallest distance
            unvisited.sort((a, b) => a.dist - b.dist);
            const current = unvisited.shift();
            if (current.visited) continue;
            current.visited = true;
            current.cell.classList.add("visited");

            if (current === end) break;

            for (let neighbor of getNeighbors(current)) {
                if (neighbor.visited) continue;
                const alt = current.dist + 1;
                if (alt < neighbor.dist) {
                    neighbor.dist = alt;
                    neighbor.prev = current;
                }
            }

            await sleep(20); // Visual animation delay
        }

        // Reconstruct path
        let pathNode = end;
        while (pathNode && pathNode !== start) {
            pathNode.cell.classList.add("path");
            pathNode = pathNode.prev;
            await sleep(30);
        }
    }
  </script>
</body>
</html>
